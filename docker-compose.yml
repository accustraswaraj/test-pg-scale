version: "3.9"

services:
  db:
    image: postgres:17.6
    container_name: cute-elephant-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - cute_elephant_postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - wal_level=logical

volumes:
  cute_elephant_postgres_data:
